<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Forge Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; background: #0b0a0c; color: #f0ede8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-image: radial-gradient(ellipse at 20% 30%, rgba(212,140,92,0.04) 0%, transparent 60%), radial-gradient(ellipse at 80% 70%, rgba(100,80,200,0.03) 0%, transparent 50%); }
        ::selection { background: #d48c5c; color: #0b0a0c; }
        .auth-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
        .auth-box h1 { font-size: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .auth-box h1 i { color: #d48c5c; }
        .auth-box .sub { color: #9a9792; margin-bottom: 24px; font-size: 14px; }
        .auth-box .brand { text-align: center; margin-bottom: 24px; }
        .auth-box .brand i { font-size: 40px; color: #d48c5c; }
        .auth-box .brand h1 { font-size: 22px; justify-content: center; background: linear-gradient(135deg, #d48c5c, #c0846a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #9a9792; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px 14px; background: #0b0a0c; border: 1px solid rgba(255,255,255,0.07); border-radius: 6px; color: #f0ede8; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.25s; }
        .form-control:focus { border-color: #d48c5c; box-shadow: 0 0 0 3px rgba(212,140,92,0.15); }
        .form-control::placeholder { color: #5e5b56; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 9999px; background: #d48c5c; color: #0b0a0c; border: none; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; font-family: inherit; transition: all 0.25s; }
        .btn:hover { background: #e09e5a; box-shadow: 0 4px 24px rgba(212,140,92,0.25); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active { transform: scale(0.96); }
        .footer-link { text-align: center; margin-top: 16px; font-size: 14px; color: #9a9792; }
        .footer-link a { color: #d48c5c; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .alert--danger { background: rgba(231,76,111,0.15); border: 1px solid #e74c6f; color: #e74c6f; }
        .alert--success { background: rgba(78,205,196,0.15); border: 1px solid #4ecdc4; color: #4ecdc4; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #0b0a0c; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="brand">
            <i class="fas fa-cube"></i>
            <h1>Forge Workspace</h1>
        </div>
        <div class="sub">欢迎回到工作交流平台</div>
        <div id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="username" class="form-control" placeholder="输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="password" class="form-control" placeholder="输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
        </form>
        <div class="footer-link">还没有账号？ <a href="/register.html">立即注册</a></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) { showError('请填写用户名和密码'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 登录中...';
            errorMsg.innerHTML = '';

            try {
                const res = await fetch('https://forge-workspace.sifangzhiji.workers.dev/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('forge_token', data.token);
                    window.location.href = '/';
                } else {
                    document.getElementById('loginError').textContent = data.error || '登录失败';
                }
            } catch (err) {
                showError('网络错误，请检查连接后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
            }
        });

        function showError(msg) {
            errorMsg.innerHTML = '<div class="alert alert--danger"><i class="fas fa-exclamation-circle"></i> ' + msg + '</div>';
        }

        document.getElementById('username').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('password').focus(); });
        document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') form.dispatchEvent(new Event('submit')); });
    </script>
</body>
</html>
