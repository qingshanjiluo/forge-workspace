        const priorityColors = { high: '#ef4444', medium: '#f59e0b', low: '#10b981' };
        const priorityIcons = { high: 'fa-flag', medium: 'fa-minus', low: 'fa-arrow-down' };
        const priorityLabels = { high: '高', medium: '中', low: '低' };

        async function loadTodos() {
            const container = document.getElementById('todoList');
            if (!container) return;
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>';
            try {
                const todos = await API.get(`/api/todos?filter=${todoFilter}&sort=${todoSort}`);
                const countEl = document.getElementById('todoCount');
                if (countEl) countEl.textContent = `共 ${todos.length} 项任务`;
                if (!todos || todos.length === 0) {
                    const msgs = { all: '还没有任务，快来添加吧！', active: '所有任务已完成！', done: '暂无已完成任务', high: '没有高优先任务', expiring: '没有即将到期的任务' };
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle" style="font-size:48px;"></i>${msgs[todoFilter] || '暂无数据'}</div>`;
                    return;
                }
                let html = '';
                for (const t of todos) {
                    const tTitle = t.title || t.content || '(无标题)';
                    const tProgress = (typeof t.progress === 'number') ? t.progress : (parseInt(t.progress, 10) || 0);
                    const isDone = tProgress >= 100;
                const isExpiring = t.due_date && !isDone && new Date(t.due_date) <= new Date(Date.now() + 3*86400000);
                const isOverdue = t.due_date && !isDone && new Date(t.due_date) < new Date();
                    html += `
                    <div class="todo-item" data-id="${t.id}" style="flex-direction:column;align-items:stretch;padding:12px 0;${isDone ? 'opacity:0.6;' : ''}">
                        <div class="flex" style="flex-wrap:wrap;align-items:center;gap:8px;">
                            <span style="display:inline-flex;align-items:center;gap:6px;min-width:120px;">
                                <span class="priority-toggle" data-id="${t.id}" data-priority="${t.priority}" style="background:${priorityColors[t.priority]};color:#fff;font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap;cursor:pointer;" title="点击切换优先级">
                                    <i class="fas ${priorityIcons[t.priority]}" style="font-size:8px;margin-right:3px;"></i>${priorityLabels[t.priority]}
                                </span>
                                <span class="todo-text editable" data-id="${t.id}" style="cursor:pointer;${isDone ? 'text-decoration:line-through;' : ''}" title="双击编辑">${escapeHtml(tTitle)}</span>
                            </span>
                            <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:160px;">
                                <input type="range" min="0" max="100" value="${tProgress}" class="progress-slider" data-id="${t.id}" style="flex:1;max-width:150px;">
                                <span class="progress-label" data-id="${t.id}">${tProgress}%</span>
                            </div>
                            ${t.due_date ? `<span style="font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;${isOverdue ? 'background:rgba(239,68,68,0.15);color:#ef4444;' : (isExpiring ? 'background:rgba(245,158,11,0.15);color:#f59e0b;' : 'background:var(--bg);color:var(--text-sec);')}"><i class="fas fa-calendar" style="font-size:10px;margin-right:3px;"></i>${isOverdue ? '已逾期: ' : '截止: '}${t.due_date}</span>` : ''}
                            <span class="todo-meta">${(t.created_at || '').substring(5)}</span>
                            <div class="todo-actions">
                                <button class="add-remark" data-id="${t.id}" title="添加备注"><i class="fas fa-pen"></i></button>
                                <button class="del" data-id="${t.id}" title="删除"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    </div>`;
                }
                container.innerHTML = html;
                bindTodoEvents();
            } catch (_) {
                container.innerHTML = '<div class="alert alert--danger"><i class="fas fa-exclamation-circle"></i> 加载失败</div>';
            }
        }

        function bindTodoEvents() {
            const container = document.getElementById('todoList');
            if (!container) return;
            container.querySelectorAll('.progress-slider').forEach(slider => {
                slider.addEventListener('input', function() {
                    const id = this.dataset.id;
                    const val = parseInt(this.value);
                    const label = document.querySelector(`.progress-label[data-id="${id}"]`);
                    if (label) label.textContent = val + '%';
                });
                slider.addEventListener('change', async function() {
                    const id = this.dataset.id;
                    const progress = parseInt(this.value);
                    await inlinePrompt(id, '请输入进度更新备注（可选）：', async (remark) => {
                        await API.put(`/api/todos/${id}`, { progress, remark: remark || '' });
                        loadTodos();
                        updateBadges();
                    });
                });
            });
            container.querySelectorAll('.editable').forEach(span => {
                span.addEventListener('dblclick', function() {
                    const id = this.dataset.id;
                    const currentText = this.textContent.trim();
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.style.cssText = 'width:100%;max-width:300px;padding:4px 8px;font-size:13px;';
                    input.value = currentText;
                    this.replaceWith(input);
                    input.focus();
                    input.select();
                    const save = async () => {
                        const newContent = input.value.trim();
                        if (newContent && newContent !== currentText) {
                            await inlinePrompt(id, '请输入内容更新备注（可选）：', async (remark) => {
                                await API.put(`/api/todos/${id}`, { content: newContent, remark: remark || '' });
                                loadTodos();
                                updateBadges();
                            });
                        } else { loadTodos(); }
                    };
                    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); save(); } if (e.key === 'Escape') loadTodos(); });
                    input.addEventListener('blur', save);
                });
            });
            container.querySelectorAll('.add-remark').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    inlinePrompt(id, '请输入备注内容：', async (remark) => {
                        if (!remark || !remark.trim()) return;
                        await API.put(`/api/todos/${id}`, { remark: remark.trim() });
                        loadTodos();
                        updateBadges();
                    });
                });
            });
            container.querySelectorAll('.del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    customConfirm('确认删除此任务？此操作不可恢复。', async (confirmed) => {
                        if (!confirmed) return;
                        await API.del(`/api/todos/${id}`);
                        loadTodos();
                        updateBadges();
                    });
                });
            });
            container.querySelectorAll('.priority-toggle').forEach(tag => {
                tag.addEventListener('click', async function() {
                    const id = this.dataset.id;
                    const current = this.dataset.priority;
                    const next = current === 'high' ? 'medium' : (current === 'medium' ? 'low' : 'high');
                    await API.put(`/api/todos/${id}`, { priority: next });
                    loadTodos();
                    updateBadges();
                });
            });
        }

        // ======================== LOGS ========================
        function initLogs() {
            document.getElementById('logForm')?.addEventListener('submit', async function(e) {
                e.preventDefault();
                const date = document.getElementById('logDate').value;
                const content = document.getElementById('logContent').value.trim();
                if (!date || !content) return;
                await API.post('/api/logs', { log_date: date, content });
                document.getElementById('logContent').value = '';
                loadLogs(document.getElementById('userFilter')?.value || 'all');
            });
            document.getElementById('userFilter')?.addEventListener('change', function() {
                loadLogs(this.value);
            });
            const dateInput = document.getElementById('logDate');
            if (dateInput) dateInput.valueAsDate = new Date();
            loadUsers().then(() => loadLogs('all'));
        }

        async function loadUsers() {
            try {
                const users = await API.get('/api/users');
                const filter = document.getElementById('userFilter');
                if (!filter || !users) return;
                filter.innerHTML = '<option value="all">全部</option>';
                users.forEach(u => {
                    const selected = currentUser && u.id === currentUser.id ? ' selected' : '';
                    filter.innerHTML += `<option value="${u.id}"${selected}>${escapeHtml(u.username)}${currentUser && u.id === currentUser.id ? ' (我)' : ''}</option>`;
                });
            } catch (_) {}
        }

        async function loadLogs(userId) {
            const container = document.getElementById('logList');
            if (!container) return;
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>';
            try {
                let url = '/api/logs';
                if (userId && userId !== 'all') url += `?user_id=${userId}`;
                const logs = await API.get(url);
                if (!logs || logs.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i> 暂无日志</div>';
                    return;
                }
                container.innerHTML = logs.map(l => `
                    <div class="log-item">
                        <div class="head"><span class="user"><i class="fas fa-user"></i> ${escapeHtml(l.username)}</span><span class="text-ter"><i class="fas fa-calendar"></i> ${l.log_date} ${(l.created_at || '').split(' ')[1]}</span></div>
                        <div class="body">${escapeHtml(l.content)}</div>
                        <div class="footer"><button class="btn btn--danger btn--sm del-log" data-id="${l.id}" style="${currentUser && (currentUser.role === 'admin' || l.user_id === currentUser.id) ? '' : 'display:none;'}"><i class="fas fa-trash-alt"></i> 删除</button></div>
                    </div>
                `).join('');
                container.querySelectorAll('.del-log').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        customConfirm('确认删除此日志？', async (ok) => { if (!ok) return; await API.del(`/api/logs/${this.dataset.id}`); loadLogs(document.getElementById('userFilter')?.value || 'all'); });
                    });
                });
            } catch (_) {
                container.innerHTML = '<div class="alert alert--danger">加载失败</div>';
            }
        }

        // ======================== MESSAGES ========================
        function initMessages() {
            document.getElementById('msgForm')?.addEventListener('submit', async function(e) {
                e.preventDefault();
                const content = document.getElementById('msgContent').value.trim();
                if (!content) return;
                await API.post('/api/messages', { content });
                document.getElementById('msgContent').value = '';
                loadMessages();
                updateBadges();
            });
            loadMessages();
        }

        async function loadMessages() {
            const container = document.getElementById('messageList');
            if (!container) return;
            try {
                const msgs = await API.get('/api/messages');
                if (!msgs || msgs.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i> 还没有留言，来发表第一条吧！</div>';
                    return;
                }
                container.innerHTML = msgs.map(m => `
                    <div class="message-item">
                        <div class="head"><span class="user"><i class="fas fa-user"></i> ${escapeHtml(m.username)}</span><span class="text-ter">${m.created_at}</span></div>
                        <div class="body">${escapeHtml(m.content)}</div>
                        <div class="footer"><button class="btn btn--danger btn--sm del-msg" data-id="${m.id}" style="${currentUser && (currentUser.role === 'admin' || m.user_id === currentUser.id) ? '' : 'display:none;'}"><i class="fas fa-trash-alt"></i> 删除</button></div>
                    </div>
                `).join('');
                container.querySelectorAll('.del-msg').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        customConfirm('删除这条留言？', async (ok) => { if (!ok) return; await API.del(`/api/messages/${this.dataset.id}`); loadMessages(); updateBadges(); });
                    });
                });
            } catch (_) {}
        }

        // ======================== MEETINGS ========================
        async function loadMeetingMemberOptions() {
            const sel = document.getElementById('meetingParticipants');
            if (!sel) return;
            try {
                const users = await API.get('/api/users');
                const members = Array.isArray(users) ? users : [];
                sel.innerHTML = members.map(u => `<option value="${u.username}">${escapeHtml(u.display_name || u.username)} (${escapeHtml(u.username)})</option>`).join('');
            } catch (_) {
                sel.innerHTML = '<option disabled>加载成员失败</option>';
            }
        }
        function initMeetings() {
            loadMeetingMemberOptions();
            document.getElementById('meetingForm')?.addEventListener('submit', async function(e) {
                e.preventDefault();
                const title = document.getElementById('meetingTitle').value.trim();
                const time = document.getElementById('meetingTime').value;
                const sel = document.getElementById('meetingParticipants');
                const participants = Array.from(sel.selectedOptions).map(o => o.value).join(', ');
                const description = document.getElementById('meetingDesc').value.trim();
                if (!title || !time) return;
                await API.post('/api/meetings', { title, meeting_time: time, participants, description });
                this.reset();
                document.getElementById('meetingTime').value = new Date().toISOString().slice(0,16);
                loadMeetings();
            });
            document.getElementById('backToMeetings')?.addEventListener('click', function() {
                leaveMeetingChat();
                document.getElementById('chatRoomView').style.display = 'none';
                document.getElementById('meetingListView').style.display = 'block';
                loadMeetings();
            });
            document.getElementById('chatSendBtn')?.addEventListener('click', sendMeetingMessage);
            document.getElementById('chatTodoBtn')?.addEventListener('click', quickMeetingTodo);
            document.getElementById('chatImageBtn')?.addEventListener('click', function() { document.getElementById('chatImageInput').click(); });
            document.getElementById('chatImageInput')?.addEventListener('change', async function(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    await API.post(`/api/meetings/${meetingChatState.meetingId}/chat`, { content: ev.target.result, message_type: 'image' });
                    e.target.value = '';
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('chatInput')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMeetingMessage(); }
            });
            document.getElementById('genTokenBtn')?.addEventListener('click', function() {
                const label = document.getElementById('tokenLabel').value.trim() || '会议令牌';
                genToken(label, 'tokenList');
            });
            const mt = document.getElementById('meetingTime');
            if (mt) mt.value = new Date().toISOString().slice(0,16);
            loadMeetings();
        }

        async function loadMeetings() {
            try {
                const meetings = await API.get('/api/meetings');
                if (!meetings) return;
                const active = meetings.filter(m => m.status === 'active');
                const ended = meetings.filter(m => m.status === 'ended');
                document.getElementById('activeMeetings').innerHTML = active.length ? active.map(m => renderMeeting(m)).join('') : '<div class="empty-state">暂无进行中的会议</div>';
                document.getElementById('endedMeetings').innerHTML = ended.length ? ended.map(m => renderMeeting(m)).join('') : '<div class="empty-state">暂无已结束的会议</div>';
                bindMeetingButtons();
            } catch (_) {}
        }

        function renderMeeting(m) {
            return `<div class="meeting-card" style="margin-bottom:10px;">
                <div class="title">${escapeHtml(m.title)}</div>
                <div class="meta"><i class="fas fa-calendar"></i> ${m.meeting_time} · <i class="fas fa-users"></i> ${escapeHtml(m.participants || '无')}</div>
                <div class="meta">${escapeHtml(m.description || '')}</div>
                <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
                    <span class="status ${m.status === 'active' ? 'active' : 'ended'}">${m.status === 'active' ? '进行中' : '已结束'}</span>
                    ${m.status === 'active' ? `<button class="btn btn--sm btn--success enter-chat" data-id="${m.id}" data-title="${escapeHtml(m.title)}"><i class="fas fa-comments"></i> 进入聊天室</button><button class="btn btn--sm btn--warning end-meeting" data-id="${m.id}"><i class="fas fa-stop"></i> 结束</button>` : ''}
                    <button class="btn btn--sm btn--danger del-meeting" data-id="${m.id}"><i class="fas fa-trash-alt"></i> 删除</button>
                </div>
            </div>`;
        }

        function bindMeetingButtons() {
            document.querySelectorAll('.enter-chat').forEach(btn => {
                btn.addEventListener('click', function() { enterMeetingChat(parseInt(this.dataset.id), this.dataset.title); });
            });
            document.querySelectorAll('.end-meeting').forEach(btn => {
                btn.addEventListener('click', async function() {
                    customConfirm('确认结束此会议？', async (ok) => { if (!ok) return; await API.post(`/api/meetings/${this.dataset.id}`, { action: 'end' }); loadMeetings(); });
                });
            });
            document.querySelectorAll('.del-meeting').forEach(btn => {
                btn.addEventListener('click', async function() {
                    customConfirm('删除此会议？', async (ok) => { if (!ok) return; await API.del(`/api/meetings/${this.dataset.id}`); loadMeetings(); });
                });
            });
        }

        async function enterMeetingChat(meetingId, title) {
            leaveMeetingChat();
            meetingChatState.meetingId = meetingId;
            meetingChatState.lastId = 0;
            document.getElementById('meetingListView').style.display = 'none';
            document.getElementById('chatRoomView').style.display = 'block';
            document.getElementById('chatRoomTitle').textContent = title;
            const statusEl = document.getElementById('chatRoomStatus');
            statusEl.textContent = '进行中';
            statusEl.style.cssText = 'background:rgba(16,185,129,0.15);color:#10b981;';
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载消息中...</div>';
            try {
                const msgs = await API.get(`/api/meetings/${meetingId}/chat?limit=50`);
                if (msgs && msgs.length > 0) {
                    renderMeetingMessages(msgs);
                    meetingChatState.lastId = msgs[msgs.length - 1].id;
                } else {
                    messagesEl.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i> 暂无消息</div>';
                }
            } catch (_) { messagesEl.innerHTML = '<div class="alert alert--danger">消息加载失败</div>'; }
            await sendMeetingPresence();
            meetingChatState.pollTimer = setInterval(pollMeetingMessages, 2000);
            meetingChatState.presenceTimer = setInterval(sendMeetingPresence, 30000);
            scrollChatToBottom(document.getElementById('chatMessages'));
            const ap = document.getElementById('authPanel');
            if (ap) ap.style.display = 'block';
            loadTokens('tokenList');
            document.getElementById('chatDrawBtn')?.addEventListener('click', function() { openMiniDraw('meeting', meetingChatState.meetingId); });
        }

        function leaveMeetingChat() {
            if (meetingChatState.pollTimer) clearInterval(meetingChatState.pollTimer);
            if (meetingChatState.presenceTimer) clearInterval(meetingChatState.presenceTimer);
            meetingChatState.pollTimer = null;
            meetingChatState.presenceTimer = null;
            meetingChatState.meetingId = null;
            const authPanel = document.getElementById('authPanel');
            if (authPanel) authPanel.style.display = 'none';
        }

        async function pollMeetingMessages() {
            if (!meetingChatState.meetingId) return;
            try {
                const msgs = await API.get(`/api/meetings/${meetingChatState.meetingId}/chat?since_id=${meetingChatState.lastId}&limit=100`);
                if (msgs && msgs.length > 0) {
                    appendMeetingMessages(msgs);
                    meetingChatState.lastId = msgs[msgs.length - 1].id;
                    for (const m of msgs) if (m.message_type === 'text') checkLinkPreviewMsg(m, '#chatMessages');
                }
                await updateMeetingOnlineUsers();
            } catch (_) {}
        }

        async function sendMeetingPresence() {
            if (!meetingChatState.meetingId) return;
            try { await API.post(`/api/meetings/${meetingChatState.meetingId}/presence`, {}); } catch (_) {}
        }

        async function updateMeetingOnlineUsers() {
            if (!meetingChatState.meetingId) return;
            try {
                const users = await API.get(`/api/meetings/${meetingChatState.meetingId}/presence`);
                const el = document.getElementById('onlineUsers');
                if (!el) return;
                el.innerHTML = users && users.length ? `<i class="fas fa-circle" style="color:#10b981;font-size:8px;"></i> ${users.length} 人在线 · ${users.map(u => escapeHtml(u.username || u.display_name)).join(', ')}` : '<i class="fas fa-circle" style="color:#94a3b8;font-size:8px;"></i> 暂无在线用户';
            } catch (_) {}
        }

        function renderMeetingMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i> 暂无消息</div>';
                return;
            }
            container.innerHTML = messages.map(m => renderChatMsg(m, true)).join('');
            for (const m of messages) if (m.message_type === 'text') checkLinkPreviewMsg(m, '#chatMessages');
        }

        function appendMeetingMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();
            for (const m of messages) {
                container.insertAdjacentHTML('beforeend', renderChatMsg(m, true));
                if (m.message_type === 'text') checkLinkPreviewMsg(m, '#chatMessages');
            }
            scrollChatToBottom(container);
        }

        function renderChatMsg(m, isMeeting) {
            const isOwn = currentUser && m.user_id === currentUser.id;
            const time = m.created_at ? m.created_at.substring(11, 16) : '';
            let contentHtml = renderMessageContent(m);
            if (m.message_type === 'html' && isMeeting) {
                contentHtml += `<div style="font-size:13px;margin-top:4px;opacity:0.7;">${escapeHtml((m.content || '').replace(/\[html\]([\s\S]*?)\[\/html\]/g, '[HTML内容]'))}</div>`;
            }
            return `<div class="chat-msg" data-msg-id="${m.id}" style="display:flex;gap:8px;padding:8px 0;${isOwn ? 'flex-direction:row-reverse;' : ''}">
                <div style="flex-shrink:0;width:32px;height:32px;border-radius:50%;background:${isOwn ? 'var(--accent)' : 'var(--bg-card-hover)'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">${escapeHtml((m.username || m.display_name || '?').charAt(0).toUpperCase())}</div>
                <div style="max-width:80%;">
                    <div style="font-size:11px;color:var(--text-ter);margin-bottom:2px;${isOwn ? 'text-align:right;' : ''}">${isOwn ? '你' : escapeHtml(m.username || m.display_name || '未知')} · ${time}</div>
                    <div style="background:${isOwn ? 'var(--accent-soft)' : 'var(--bg)'};padding:8px 14px;border-radius:${isOwn ? '12px 4px 12px 12px' : '4px 12px 12px 12px'};border:1px solid var(--border);">${contentHtml}</div>
                </div>
            </div>`;
        }

        function checkLinkPreviewMsg(msg, containerPrefix) {
            return checkLinkPreview(msg, containerPrefix + ' .chat-msg[data-msg-id="{id}"]', 'sm');
        }

        async function sendMeetingMessage() {
            if (!meetingChatState.meetingId) return;
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content) return;
            document.getElementById('chatSendBtn').disabled = true;
            try {
                let messageType = 'text';
                if (content.startsWith('/todo ')) messageType = 'todo';
                else if (content.includes('[html]') && content.includes('[/html]')) messageType = 'html';
                await API.post(`/api/meetings/${meetingChatState.meetingId}/chat`, { content, message_type: messageType });
                input.value = '';
                input.focus();
                await pollMeetingMessages();
            } catch (_) {}
            document.getElementById('chatSendBtn').disabled = false;
        }

        function quickMeetingTodo() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && !text.startsWith('/todo ')) { input.value = '/todo ' + text; }
            else if (!text) { input.value = '/todo '; }
            input.focus();
        }

        // ======================== PUBLIC CHAT ========================
        function initPublicChat() {
            document.getElementById('pubChatSendBtn')?.addEventListener('click', sendPublicMessage);
            document.getElementById('pubChatDrawBtn')?.addEventListener('click', function() { openMiniDraw('public', 0); });
            document.getElementById('pubChatTodoBtn')?.addEventListener('click', function() {
                const input = document.getElementById('pubChatInput');
                const text = input.value.trim();
                if (text && !text.startsWith('/todo ')) { input.value = '/todo ' + text; }
                else if (!text) { input.value = '/todo '; }
                input.focus();
            });
            document.getElementById('pubChatImageBtn')?.addEventListener('click', function() { document.getElementById('pubChatImageInput').click(); });
            document.getElementById('pubChatImageInput')?.addEventListener('change', async function(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    await API.post('/api/chat', { content: ev.target.result, message_type: 'image' });
                    e.target.value = '';
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('pubChatInput')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPublicMessage(); }
            });
            document.getElementById('pubGenTokenBtn')?.addEventListener('click', function() {
                const label = document.getElementById('pubTokenLabel').value.trim() || '聊天令牌';
                genToken(label, 'pubTokenList');
            });

            loadPublicMessages();
            loadTokens('pubTokenList');
            pubChatState.pollTimer = setInterval(pollPublicMessages, 2000);
            sendPublicPresence();
            pubChatState.presenceTimer = setInterval(sendPublicPresence, 30000);
            setInterval(updatePublicOnlineUsers, 10000);

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (pubChatState.pollTimer) { clearInterval(pubChatState.pollTimer); pubChatState.pollTimer = null; }
                    if (pubChatState.presenceTimer) { clearInterval(pubChatState.presenceTimer); pubChatState.presenceTimer = null; }
                } else {
                    if (!pubChatState.pollTimer) { pubChatState.pollTimer = setInterval(pollPublicMessages, 2000); pollPublicMessages(); }
                    if (!pubChatState.presenceTimer) { pubChatState.presenceTimer = setInterval(sendPublicPresence, 30000); sendPublicPresence(); }
                }
            });
        }

        function leavePublicChat() {
            if (pubChatState.pollTimer) clearInterval(pubChatState.pollTimer);
            if (pubChatState.presenceTimer) clearInterval(pubChatState.presenceTimer);
            pubChatState.pollTimer = null;
            pubChatState.presenceTimer = null;
        }

        async function loadPublicMessages() {
            const container = document.getElementById('chatMessagesPublic');
            if (!container) return;
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载消息中...</div>';
            try {
                const msgs = await API.get('/api/chat?limit=50');
                if (!msgs || msgs.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i> 开始第一次对话吧！</div>';
                    return;
                }
                container.innerHTML = msgs.map(m => renderChatMsg(m, false)).join('');
                pubChatState.lastId = msgs[msgs.length - 1].id;
                scrollChatToBottom(container);
                for (const m of msgs) if (m.message_type === 'text') checkLinkPreviewMsg(m, '#chatMessagesPublic');

        function renderMarkdown(text) {
            let html = escapeHtml(text);
            html = html.replace(/^### (.+)$/gm, '<h3 style="margin:12px 0 6px;font-size:16px;font-weight:600;">$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2 style="margin:16px 0 8px;font-size:20px;font-weight:700;">$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1 style="margin:20px 0 10px;font-size:24px;font-weight:800;">$1</h1>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px;">$1</code>');
            html = html.replace(/^- (.+)$/gm, '<li style="margin:2px 0 2px 20px;">$1</li>');
            html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin:2px 0 2px 20px;list-style:decimal;">$1</li>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent);">$1</a>');
            html = html.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
            const paragraphs = html.split(/\n\n+/);
            html = paragraphs.map(p => '<p style="margin:8px 0;">' + p.replace(/\n/g, '<br>') + '</p>').join('');
            return '<div style="padding:4px 0;">' + html + '</div>';
        }

        function updateDocPreview() {
            const type = document.getElementById('editorType').value;
            const content = document.getElementById('editorContent').value;
            const panel = document.getElementById('previewPanel');
            const preview = document.getElementById('previewContent');
            if (!panel || !preview) return;
            if (!content.trim()) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            if (type === 'markdown') preview.innerHTML = renderMarkdown(content);
            else if (type === 'html') preview.innerHTML = '<iframe srcdoc="' + escapeHtml(content) + '" sandbox="allow-same-origin" style="width:100%;height:400px;border:none;background:#fff;border-radius:8px;"></iframe>';
            else preview.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;">' + escapeHtml(content) + '</pre>';
        }

            overlay.className = 'inline-prompt-overlay';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border-radius:12px;padding:20px 24px;min-width:320px;max-width:450px;box-shadow:0 8px 40px rgba(0,0,0,0.3);border:1px solid var(--border);">
                    <div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);">${placeholder}</div>
                    <input type="text" class="form-control" id="inline-input-${id}" placeholder="直接回车跳过..." style="margin-bottom:12px;" autofocus>
                    <div style="display:flex;gap:8px;justify-content:flex-end;">
                        <button class="btn btn--sm inline-prompt-cancel">取消</button>
                        <button class="btn btn--sm btn--primary inline-prompt-ok">确定</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('input');
            setTimeout(() => input.focus(), 100);
            const done = (val) => { overlay.remove(); callback(val); };
            overlay.querySelector('.inline-prompt-ok').addEventListener('click', () => done(input.value));
            overlay.querySelector('.inline-prompt-cancel').addEventListener('click', () => done(null));
            overlay.addEventListener('click', function(e) { if (e.target === overlay) done(null); });
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); done(input.value); } if (e.key === 'Escape') done(null); });
        }

        function customConfirm(message, callback) {
            const old = document.querySelector('.custom-confirm-overlay');
            if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.className = 'custom-confirm-overlay';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border-radius:12px;padding:20px 24px;min-width:300px;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,0.3);border:1px solid var(--border);text-align:center;">
                    <div style="font-size:40px;margin-bottom:8px;color:#ef4444;"><i class="fas fa-exclamation-triangle"></i></div>
                    <div style="font-size:14px;margin-bottom:16px;color:var(--text);">${message}</div>
                    <div style="display:flex;gap:8px;justify-content:center;">
                        <button class="btn btn--sm custom-confirm-cancel">取消</button>
                        <button class="btn btn--sm btn--danger custom-confirm-ok">确认</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('.custom-confirm-ok').addEventListener('click', () => { overlay.remove(); callback(true); });
            overlay.querySelector('.custom-confirm-cancel').addEventListener('click', () => { overlay.remove(); callback(false); });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) { overlay.remove(); callback(false); } });
        }

        // ======================== BADGES ========================
        async function updateBadges() {
            try {
                const todos = await API.get('/api/todos');
                const todoBadge = document.getElementById('todoBadge');
                if (todoBadge && todos && todos.length > 0) {
                    const avg = Math.round(todos.reduce((s, t) => s + (t.progress || 0), 0) / todos.length);
                    todoBadge.textContent = avg + '%';
                }
                const msgs = await API.get('/api/messages');
                const msgBadge = document.getElementById('msgBadge');
                if (msgBadge && msgs) msgBadge.textContent = msgs.length || 0;
            } catch (_) {}
        }

        // ======================== SCROLL ANNOUNCEMENT ========================
        async function loadScrollAnnouncement() {
            try {
                const data = await API.get('/api/announcements/scroll');
                const el = document.getElementById('announcementContent');
                if (el) el.textContent = (data && data.content) || '暂无公告';
            } catch (_) {
                document.getElementById('announcementContent').textContent = '公告加载失败';
            }
        }

        // ======================== MOBILE MENU ========================
        document.getElementById('hamburgerBtn')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
            document.body.style.overflow = document.getElementById('sidebar').classList.contains('open') ? 'hidden' : '';
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        });

        // ======================== CHANGE PASSWORD ========================
        document.getElementById('changePwdLink')?.addEventListener('click', async function() {
            inlinePrompt('change-pwd-old', '请输入当前密码：', async (oldPwd) => {
                if (oldPwd === null) return;
                inlinePrompt('change-pwd-new', '请输入新密码（至少4位）：', async (newPwd) => {
                    if (newPwd === null || newPwd.length < 4) return;
                    inlinePrompt('change-pwd-confirm', '请再次输入新密码：', async (confirmPwd) => {
                        if (confirmPwd !== newPwd) return;
                        const data = await API.post('/api/auth/change-password', { old_password: oldPwd, new_password: newPwd, confirm_password: confirmPwd });
                        if (data && data.success) { alert('密码已修改，请重新登录'); logout(); }
                        else { alert('错误: ' + ((data && data.error) || '修改失败')); }
                    });
                });
            });
        });

        // ======================== INTERVALS ========================
        setInterval(updateBadges, 30000);

        // ======================== START ========================
        loadScrollAnnouncement();
        initApp();
    </script>

</body>
</html>
