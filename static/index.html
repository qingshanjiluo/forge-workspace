<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>工作交流平台 · Forge Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/js/api.js"></script>
    <style>
        :root {
            --bg: #0b0a0c;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.07);
            --border-active: rgba(255, 255, 255, 0.16);
            --text: #f0ede8;
            --text-sec: #9a9792;
            --text-ter: #5e5b56;
            --accent: #d48c5c;
            --accent-soft: rgba(212, 140, 92, 0.15);
            --accent-glow: rgba(212, 140, 92, 0.25);
            --danger: #e74c6f;
            --success: #4ecdc4;
            --warning: #f9ca24;
            --font: 'Inter', -apple-system, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
            --radius: 12px;
            --radius-sm: 6px;
            --radius-full: 9999px;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            --transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            --header-height: 60px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(212,140,92,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(100,80,200,0.03) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
        }
        ::selection { background: var(--accent); color: #0b0a0c; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar__brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
            text-decoration: none;
        }
        .topbar__brand i { color: var(--accent); font-size: 22px; }
        .topbar__brand span {
            background: linear-gradient(135deg, var(--accent), #c0846a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar__right { display: flex; align-items: center; gap: 12px; }
        .topbar__user { font-size: 13px; color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
        .topbar__user .name { font-weight: 600; color: var(--text); }
        .topbar__hamburger {
            background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer;
            padding: 4px 8px; border-radius: var(--radius-sm); transition: background var(--transition);
            display: none;
        }
        .topbar__hamburger:hover { background: var(--bg-card-hover); }
        #scrollAnnouncement {
            background: var(--accent-soft);
            border-bottom: 1px solid var(--border);
            padding: 6px 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            z-index: 999;
        }
        #announcementText {
            display: inline-block;
            padding-left: 100%;
            animation: scrollAnnounce 20s linear infinite;
            font-size: 14px;
            color: var(--text);
        }
        @keyframes scrollAnnounce {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @media (max-width: 768px) {
            #announcementText { animation-duration: 15s; }
        }
        .sidebar {
            width: 220px;
            min-height: calc(100vh - var(--header-height));
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
            overflow-y: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.3s ease;
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-sec);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition);
            border: 1px solid transparent;
            cursor: pointer;
            background: none;
            width: 100%;
            font-family: var(--font);
        }
        .sidebar .nav-link i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar .nav-link:hover {
            background: var(--bg-card-hover);
            color: var(--text);
            border-color: var(--border);
        }
        .sidebar .nav-link.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent);
        }
        .sidebar .nav-link .badge {
            margin-left: auto;
            background: var(--accent);
            color: #0b0a0c;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: var(--radius-full);
        }
        .sidebar__logout {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .sidebar__logout .nav-link { color: var(--text-ter); }
        .sidebar__logout .nav-link:hover { color: var(--danger); border-color: var(--danger); }
        .sidebar__user {
            padding: 12px 8px;
            background: var(--bg-card-hover);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 13px;
            border: 1px solid var(--border);
            min-height: 72px;
        }
        .sidebar__user .user-avatar { width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;float:left;margin-right:10px;overflow:hidden;transition:opacity .2s; }
        .sidebar__user .user-avatar:hover { opacity:.8; }
        .sidebar__user .user-avatar img { width:100%;height:100%;object-fit:cover; }
        .sidebar__user .name { font-weight: 600; color: var(--text); }
        .sidebar__user .role { font-size: 11px; color: var(--text-ter); }
        .sidebar__user .change-pwd-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar__user .change-pwd-link:hover { text-decoration: underline; }
        .app-wrapper { display: flex; flex: 1; }
        .main {
            flex: 1;
            padding: 24px 32px 40px;
            overflow-y: auto;
            max-width: calc(100% - 220px);
        }
        @media (max-width: 768px) {
            .topbar__hamburger { display: block; }
            .topbar__user .name { display: none; }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                left: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                z-index: 999;
                background: var(--bg);
                border-right: 1px solid var(--border);
                box-shadow: 4px 0 24px rgba(0,0,0,0.4);
                transition: transform 0.3s ease;
                padding: 16px 12px;
                overflow-y: auto;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: var(--header-height);
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 998;
            }
            .sidebar-overlay.active { display: block; }
            .main { max-width: 100%; padding: 16px 16px 30px; }
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 20px;
            transition: border-color var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .card:hover { border-color: var(--border-active); }
        .card__title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 1024px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-sec); margin-bottom: 4px; }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            transition: border-color var(--transition);
            outline: none;
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .form-control::placeholder { color: var(--text-ter); }
        textarea.form-control { resize: vertical; min-height: 80px; }
        select.form-control { cursor: pointer; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-sec);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-active);
            color: var(--text);
            transform: translateY(-1px);
        }
        .btn:active { transform: scale(0.96); }
        .btn--primary { background: var(--accent); border-color: var(--accent); color: #0b0a0c; }
        .btn--primary:hover { background: #e09e5a; border-color: #e09e5a; color: #0b0a0c; box-shadow: 0 4px 24px var(--accent-glow); }
        .btn--danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn--danger:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
        .btn--success { background: var(--success); border-color: var(--success); color: #0b0a0c; }
        .btn--success:hover { background: #45b7a0; border-color: #45b7a0; color: #0b0a0c; }
        .btn--sm { padding: 4px 12px; font-size: 12px; }
        .btn--ghost { background: transparent; border-color: transparent; }
        .btn--ghost:hover { background: var(--bg-card-hover); border-color: var(--border); }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .todo-item:last-child { border-bottom: none; }
        .todo-text { flex: 1; font-size: 14px; }
        .todo-text.done-text { text-decoration: line-through; color: var(--text-ter); }
        .todo-meta { font-size: 11px; color: var(--text-ter); }
        .todo-actions button {
            background: none;
            border: none;
            color: var(--text-ter);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 14px;
        }
        .todo-actions button:hover { background: var(--bg-card-hover); color: var(--text); }
        .todo-actions .del:hover { color: var(--danger); }
        .progress-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: var(--radius-full);
            background: var(--border);
            outline: none;
            transition: background 0.2s;
        }
        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .progress-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg);
        }
        .progress-label { font-weight: 600; font-size: 13px; min-width: 40px; text-align: center; color: var(--text); }
        .message-item, .log-item, .announcement-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .message-item:last-child, .log-item:last-child, .announcement-item:last-child { border-bottom: none; }
        .message-item .head, .log-item .head, .announcement-item .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sec);
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .message-item .head .user, .log-item .head .user, .announcement-item .head .user { font-weight: 600; color: var(--text); }
        .message-item .body, .log-item .body, .announcement-item .body { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .message-item .footer, .announcement-item .footer { margin-top: 6px; font-size: 12px; color: var(--text-ter); display: flex; gap: 12px; align-items: center; }
        .meeting-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; transition: all var(--transition); }
        .meeting-card:hover { border-color: var(--border-active); transform: translateY(-2px); }
        .meeting-card .title { font-size: 16px; font-weight: 600; }
        .meeting-card .meta { font-size: 13px; color: var(--text-sec); margin: 6px 0 10px; }
        .meeting-card .status { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 12px; border-radius: var(--radius-full); background: var(--accent-soft); color: var(--accent); }
        .meeting-card .status.active { background: rgba(78,205,196,0.2); color: var(--success); }
        .meeting-card .status.ended { background: rgba(231,76,111,0.15); color: var(--danger); }
        .empty-state { text-align: center; padding: 32px 0; color: var(--text-ter); }
        .empty-state i { opacity: 0.15; font-size: 48px; margin-bottom: 12px; display: block; }
        .alert { padding: 12px 18px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; border: 1px solid transparent; }
        .alert--success { background: rgba(78,205,196,0.15); border-color: var(--success); color: var(--success); }
        .alert--danger { background: rgba(231,76,111,0.15); border-color: var(--danger); color: var(--danger); }
        .alert--warning { background: rgba(249,202,36,0.15); border-color: var(--warning); color: var(--warning); }
        .flex { display: flex; }
        .flex-center { align-items: center; justify-content: center; }
        .gap-sm { gap: 8px; }
        .gap-md { gap: 16px; }
        .mt-sm { margin-top: 8px; }
        .mt-md { margin-top: 16px; }
        .mb-sm { margin-bottom: 8px; }
        .mb-md { margin-bottom: 16px; }
        .text-center { text-align: center; }
        .text-ter { color: var(--text-ter); }
        .w-full { width: 100%; }
        .fade-in { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0b0a0c; font-weight: 600; }
        .page-header { margin-bottom: 20px; }
        .page-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-header h1 i { color: var(--accent); }
        .page-header small { font-size: 13px; font-weight: 400; color: var(--text-sec); margin-left: 8px; }
        .page-content { display: none; }
        .page-content.active { display: block; animation: fadeUp 0.3s ease; }
        #chatMessages { scroll-behavior: smooth; }
        #chatMessages::-webkit-scrollbar { width: 4px; }
        #chatMessages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        #chatMessages::-webkit-scrollbar-track { background: var(--border); border-radius: 2px; }
        .link-preview-card { display:block; margin-top:8px; text-decoration:none; color:inherit; border:1px solid var(--border); border-radius:8px; overflow:hidden; transition:border-color 0.2s; }
        .link-preview-card:hover { border-color: var(--accent); }
        .link-preview-card-sm { display:block; margin-top:6px; text-decoration:none; color:inherit; border:1px solid var(--border); border-radius:8px; overflow:hidden; transition:border-color 0.2s; }
        .link-preview-card-sm:hover { border-color: var(--accent); }
        .page-loading { text-align: center; padding: 60px 0; color: var(--text-ter); }
        .page-loading i { font-size: 32px; opacity: 0.3; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .inline-prompt-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:9999; display:flex; align-items:center; justify-content:center; }
        .custom-confirm-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:9999; display:flex; align-items:center; justify-content:center; }
        #previewContent h1, #previewContent h2, #previewContent h3 { color: var(--text); }
        #previewContent a { color: var(--accent); }
        #previewContent code { background: var(--bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
        #previewContent pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
        #previewContent img { max-width: 100%; border-radius: 8px; }
        #previewContent blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: var(--text-sec); }
        #previewContent table { border-collapse: collapse; width: 100%; margin: 8px 0; }
        #previewContent th, #previewContent td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
        #previewContent th { background: var(--bg-card); }
        .timeline-wrapper::-webkit-scrollbar { height: 4px; }
        .timeline-wrapper::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        .timeline-wrapper::-webkit-scrollbar-track { background: var(--border); border-radius: 2px; }
        .modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center; }
        .modal { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);max-width:500px;width:90%;max-height:80vh;overflow-y:auto; }
        .modal__header { padding:16px 20px;font-weight:600;border-bottom:1px solid var(--border);font-size:16px; }
        .modal__body { padding:16px 20px; }
        .modal__footer { padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end; }
        .draw-canvas { border:1px solid var(--border);border-radius:var(--radius-sm);cursor:crosshair;touch-action:none;max-width:100%; }
        .draw-tools { display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px; }
        .draw-tools button { padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;font-size:12px;font-family:inherit; }
        .draw-tools button.active { background:var(--accent);color:var(--bg);border-color:var(--accent); }
        .draw-tools input[type=color] { width:32px;height:32px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:0;background:0; }
        .draw-tools input[type=range] { width:80px; }
        .drawing-msg-card { transition: background .15s; }
        .drawing-msg-card:hover { background:rgba(212,140,92,0.2) !important; }
        #collabCanvasModal .modal { background:var(--bg-card); }
        #collabCanvasModal .draw-tools button { padding:5px 10px;font-size:11px; }
        #collabCanvasModal .draw-tools button.active { background:var(--accent);color:var(--bg);border-color:var(--accent); }
        #miniDrawPopover .draw-tools button { padding:4px 8px;font-size:11px; }
        #miniDrawPopover .draw-tools button.active { background:var(--accent);color:var(--bg);border-color:var(--accent); }
        .gallery-card { border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg-card);transition:transform .15s,box-shadow .15s; }
        .gallery-card:hover { transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.25);border-color:var(--accent); }
        .gallery-thumb { width:100%;height:120px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--border); }
        .gallery-thumb img { width:100%;height:100%;object-fit:cover; }
        .gallery-thumb .empty-thumb { color:#cbd5e1;font-size:34px; }
        .gallery-info { padding:8px 10px; }
        .gallery-info .g-title { font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .gallery-info .g-meta { font-size:11px;color:var(--text-ter);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap; }
        .chat-image { max-width:200px;max-height:200px;border-radius:8px;cursor:pointer;margin-top:4px; }
        .chat-image:hover { opacity:.9; }
        .group-tag { display:inline-block;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;margin-left:4px; }
    </style>
</head>
<body>

    <header class="topbar">
        <a href="/" class="topbar__brand" onclick="navigate('dashboard');return false;">
            <i class="fas fa-cube"></i>
            <span>Workspace</span>
        </a>
        <div class="topbar__right">
            <div class="topbar__user">
                <i class="fas fa-user-circle"></i>

                    </div>
                </div>
            </div>
        </div>

    <script src="/js/chat-common.js"></script>
    <script>
        // ======================== STATE ========================
        let currentUser = null;
        let currentPage = 'dashboard';
        let meetingChatState = { meetingId: null, lastId: 0, pollTimer: null, presenceTimer: null };
        let pubChatState = { lastId: 0, pollTimer: null, presenceTimer: null };

        // ======================== AUTH & INIT ========================
        async function initApp() {
            try {
                const user = await API.get('/api/auth/me');
                if (!user) return;
                currentUser = user;
                document.getElementById('topbarUsername').textContent = user.display_name || user.username || '用户';
                document.getElementById('topbarRole').textContent = '(' + (user.role || 'member') + ')';
                document.getElementById('sidebarUsername').textContent = user.display_name || user.username || '用户';
                document.getElementById('sidebarRole').textContent = user.role || 'member';
                if (user.avatar) { document.getElementById('sidebarAvatarImg').src = user.avatar; document.getElementById('sidebarAvatarImg').style.display = ''; document.getElementById('sidebarAvatarIcon').style.display = 'none'; }
                if (user.group) { document.getElementById('sidebarGroup').innerHTML = '<span style="color:'+user.group.color+'"><i class="fas '+user.group.icon+'"></i> '+user.group.name+'</span>'; }
                if (user.role === 'admin') {
                    document.getElementById('adminNavLink').style.display = 'flex';
                }
                const page = new URLSearchParams(location.search).get('page') || 'dashboard';
                if (location.hash) {
                    const hashPage = location.hash.replace('#', '');
                    if (['dashboard','todos','logs','messages','meetings','public_chat','documents','announcements','admin','draw'].includes(hashPage)) {
                        navigate(hashPage);
                        return;
                    }
                }
                navigate(page);
            } catch (e) {
                // API.request already redirects on 401
            }
        }

        // ======================== NAVIGATION ========================
        function navigate(page) {
            if (page === currentPage && document.getElementById('page-' + page)?.content?.ownerDocument) {
                // same page, just ensure visible
            }
            currentPage = page;

            // Clean up any chat timers
            leaveMeetingChat();
            leavePublicChat();

            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const navLink = document.querySelector(`.nav-link[data-page="${page}"]`);
            if (navLink) navLink.classList.add('active');

            const main = document.getElementById('mainContent');
            const template = document.getElementById('page-' + page);
            if (!template) { main.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> 页面不存在</div>'; return; }

            main.innerHTML = '';
            const clone = template.content.cloneNode(true);
            main.appendChild(clone);
            main.querySelector('.page-content')?.classList.add('active');

            // Close mobile sidebar
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
                document.body.style.overflow = '';
            }

            // Update URL
            const url = new URL(location);
            url.searchParams.set('page', page);
            history.replaceState({ page }, '', url);

            // Call page-specific loader
            switch (page) {
                case 'dashboard': loadDashboard(); break;
                case 'todos': initTodos(); break;
                case 'logs': initLogs(); break;
                case 'messages': initMessages(); break;
                case 'meetings': initMeetings(); break;
                case 'public_chat': initPublicChat(); break;
                case 'documents': initDocuments(); break;
                case 'announcements': initAnnouncements(); break;
                case 'admin': initAdmin(); break;
                case 'draw': initDraw(); loadDrawPageGallery(); break;
            }
        }

        // ======================== LOGOUT ========================
        async function logout() {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('forge_token') || '') }
            });
            localStorage.removeItem('forge_token');
            window.location.href = '/login.html';
        }

        // ======================== PROFILE MODAL ========================
        function showProfileModal() {
            document.getElementById('profileDisplayName').value = currentUser?.display_name || '';
            if (currentUser?.avatar) { document.getElementById('modalAvatarImg').src = currentUser.avatar; document.getElementById('modalAvatarImg').style.display = ''; document.getElementById('modalAvatarIcon').style.display = 'none'; }
            else { document.getElementById('modalAvatarImg').style.display = 'none'; document.getElementById('modalAvatarIcon').style.display = ''; }
            document.getElementById('profileMsg').textContent = '';
            document.getElementById('profileModal').style.display = 'flex';
        }
        function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }
        function handleAvatarUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const size = 160;
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    // cover-fit crop to square
                    const scale = Math.max(size / img.width, size / img.height);
                    const w = img.width * scale, h = img.height * scale;
                    ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    document.getElementById('modalAvatarImg').src = dataUrl;
                    document.getElementById('modalAvatarImg').style.display = '';
                    document.getElementById('modalAvatarIcon').style.display = 'none';
                    window._pendingAvatar = dataUrl;
                };

        // ======================== DRAWING BOARD ========================
        let drawBrush = { color: '#d48c5c', size: 3, mode: 'free' };
        let drawHistory = [];
        let drawCanvas, drawCtx, drawDrawing = false, drawShapeStart = null;
        let pixelSize = 16;
        let mindMapNodes = [];
        let mindMapEdges = [];
        let mindMapSelected = null;
        let mindMapDrag = null;

        function initDraw() {
            drawCanvas = document.getElementById('drawCanvas');
            if (!drawCanvas) return;
            drawCtx = drawCanvas.getContext('2d');
            drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
            drawCanvas.addEventListener('mousedown', startDraw);
            drawCanvas.addEventListener('mousemove', drawMove);
            drawCanvas.addEventListener('mouseup', endDraw);
            drawCanvas.addEventListener('mouseleave', endDraw);
            drawCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); const t=e.touches[0]; startDraw({offsetX:t.clientX-drawCanvas.getBoundingClientRect().left,offsetY:t.clientY-drawCanvas.getBoundingClientRect().top}); });
            drawCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); const t=e.touches[0]; drawMove({offsetX:t.clientX-drawCanvas.getBoundingClientRect().left,offsetY:t.clientY-drawCanvas.getBoundingClientRect().top}); });
            drawCanvas.addEventListener('touchend', endDraw);
            drawCanvas.addEventListener('dblclick', function(e) {
                if (drawBrush.mode !== 'mindmap') return;
                const p = drawPt(e);
                const node = getMindMapNodeAt(p.x, p.y);
                if (node) {
                    const label = prompt('编辑节点名称:', node.label);
                    if (label !== null) { node.label = label || node.label; renderMindMap(); saveDrawState(); }
                }
            });
            renderDrawPalette();
            saveDrawState();
            if (drawBrush.mode === 'pixel') drawPixelGrid();
        }
        function setDrawMode(mode) {
            drawBrush.mode = mode;
            document.querySelectorAll('.draw-tools button[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            if (mode === 'pixel') { drawPixelGrid(); drawCanvas.style.cursor = 'crosshair'; }
            else if (mode === 'mindmap') { drawCanvas.style.cursor = 'default'; }
            else { drawCanvas.style.cursor = 'crosshair'; }
        }
        function drawPt(e) {
            const rect = drawCanvas.getBoundingClientRect();
            return { x: (e.offsetX||0) * (drawCanvas.width/rect.width), y: (e.offsetY||0) * (drawCanvas.height/rect.height) };
        }
        function startDraw(e) {
            if (drawBrush.mode === 'mindmap') {
                const p = drawPt(e);
                const node = getMindMapNodeAt(p.x, p.y);
                if (node) {
                    if (mindMapSelected && mindMapSelected !== node.id) {
                        // connect selected -> clicked
                        const exists = mindMapEdges.some(ed => ed.from === mindMapSelected && ed.to === node.id);
                        if (!exists) mindMapEdges.push({from: mindMapSelected, to: node.id});
                        mindMapSelected = null; renderMindMap(); saveDrawState();
                    } else {
                        mindMapSelected = node.id;
                        mindMapDrag = { node, dx: p.x - node.x, dy: p.y - node.y };
                        renderMindMap();
                    }
                } else {
                    mindMapSelected = null; renderMindMap();
                }
                return;
            }
            const p = drawPt(e);
            if (drawBrush.mode === 'pixel') { drawPixel(p.x, p.y); return; }
            if (['line','rect','circle','arrow'].includes(drawBrush.mode)) {
                drawShapeStart = p; drawDrawing = true; drawHistory.push(drawCanvas.toDataURL()); return;
            }
            drawDrawing = true; drawHistory.push(drawCanvas.toDataURL());
            drawCtx.beginPath(); drawCtx.moveTo(p.x, p.y);
        }
        function drawMove(e) {
            if (drawBrush.mode === 'mindmap' && mindMapDrag) {
                const p = drawPt(e);
                mindMapDrag.node.x = p.x - mindMapDrag.dx;
                mindMapDrag.node.y = p.y - mindMapDrag.dy;
                renderMindMap();
                return;
            }
            if (!drawDrawing) return;
            const p = drawPt(e);
            if (['line','rect','circle','arrow'].includes(drawBrush.mode)) {
                const snap = drawHistory[drawHistory.length-1];
                const img = new Image();
                img.onload = () => { drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height); drawCtx.drawImage(img,0,0); drawShape(drawShapeStart, p); };
                img.src = snap; return;
            }
            if (drawBrush.mode !== 'free') return;
            drawCtx.strokeStyle = drawBrush.color; drawCtx.lineWidth = drawBrush.size;
            drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        }
        function endDraw() {
            if (drawBrush.mode === 'mindmap' && mindMapDrag) { mindMapDrag = null; saveDrawState(); return; }
            if (drawDrawing) { drawDrawing = false; drawShapeStart = null; saveDrawState(); }
        }
        function drawShape(a, b) {
            if (!a || !b) return;
            drawCtx.strokeStyle = drawBrush.color; drawCtx.fillStyle = drawBrush.color; drawCtx.lineWidth = drawBrush.size;
            if (drawBrush.mode === 'line') { drawCtx.beginPath(); drawCtx.moveTo(a.x,a.y); drawCtx.lineTo(b.x,b.y); drawCtx.stroke(); }
            else if (drawBrush.mode === 'rect') { drawCtx.strokeRect(a.x, a.y, b.x-a.x, b.y-a.y); }
            else if (drawBrush.mode === 'circle') { const rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2, cx=a.x+(b.x-a.x)/2, cy=a.y+(b.y-a.y)/2; drawCtx.beginPath(); drawCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); drawCtx.stroke(); }
            else if (drawBrush.mode === 'arrow') {
                drawCtx.beginPath(); drawCtx.moveTo(a.x,a.y); drawCtx.lineTo(b.x,b.y); drawCtx.stroke();
                const ang=Math.atan2(b.y-a.y,b.x-a.x), h=12;
                drawCtx.beginPath(); drawCtx.moveTo(b.x,b.y); drawCtx.lineTo(b.x-h*Math.cos(ang-Math.PI/6), b.y-h*Math.sin(ang-Math.PI/6));
                drawCtx.moveTo(b.x,b.y); drawCtx.lineTo(b.x-h*Math.cos(ang+Math.PI/6), b.y-h*Math.sin(ang+Math.PI/6)); drawCtx.stroke();
            }
        }
        function renderDrawPalette() {
            const pal = document.getElementById('drawPalette');
            if (!pal) return;
            pal.innerHTML = RICH_COLORS.map(c => `<span onclick="drawBrush.color='${c}';document.getElementById('drawColor').value='${c}';" title="${c}" style="width:18px;height:18px;border-radius:4px;background:${c};cursor:pointer;border:1px solid rgba(255,255,255,0.2);display:inline-block;"></span>`).join('');
        }
        async function drawPublishToChat() {
            try { await API.post('/api/chat', { content: drawCanvas.toDataURL('image/png'), message_type: 'image' }); alert('已发布到公共聊天室'); } catch(e){ alert('发布失败'); }
        }
        function drawPixel(x, y) {
            const cols = Math.floor(drawCanvas.width / pixelSize);
            const rows = Math.floor(drawCanvas.height / pixelSize);
            const px = Math.floor(x / pixelSize) * pixelSize;
            const py = Math.floor(y / pixelSize) * pixelSize;
            drawCtx.fillStyle = drawBrush.color; drawCtx.fillRect(px, py, pixelSize, pixelSize);
            drawCtx.strokeStyle = 'rgba(255,255,255,0.1)'; drawCtx.strokeRect(px, py, pixelSize, pixelSize);
            saveDrawState();
        }
        function drawPixelGrid() {
            if (!drawCtx) return;
            const cols = Math.floor(drawCanvas.width / pixelSize);
            const rows = Math.floor(drawCanvas.height / pixelSize);
            drawCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i <= cols; i++) { drawCtx.beginPath(); drawCtx.moveTo(i * pixelSize, 0); drawCtx.lineTo(i * pixelSize, drawCanvas.height); drawCtx.stroke(); }
            for (let i = 0; i <= rows; i++) { drawCtx.beginPath(); drawCtx.moveTo(0, i * pixelSize); drawCtx.lineTo(drawCanvas.width, i * pixelSize); drawCtx.stroke(); }
        }
        function addMindMapNode(x, y) {
            const id = Date.now() + Math.floor(Math.random() * 1000);
            const label = prompt('节点名称:', '新节点') || '新节点';
            mindMapNodes.push({id, x, y, label});
            renderMindMap();
            saveDrawState();
        }
        function getMindMapNodeAt(x, y) {
            for (let i = mindMapNodes.length - 1; i >= 0; i--) {
                const n = mindMapNodes[i];
                const tw = drawCtx.measureText(n.label).width;
                const rw = tw + 20, rh = 30;
                if (x >= n.x - rw/2 && x <= n.x + rw/2 && y >= n.y - rh/2 && y <= n.y + rh/2) return n;
            }
            return null;
        }
        function renderMindMap() {
            if (!drawCtx) return;
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            // edges first
            mindMapEdges.forEach(e => {
                const a = mindMapNodes.find(n => n.id === e.from), b = mindMapNodes.find(n => n.id === e.to);
                if (!a || !b) return;
                drawCtx.strokeStyle = 'rgba(212,140,92,0.6)'; drawCtx.lineWidth = 2;
                drawCtx.beginPath(); drawCtx.moveTo(a.x, a.y); drawCtx.lineTo(b.x, b.y); drawCtx.stroke();
            });
            mindMapNodes.forEach(n => {
                const tw = drawCtx.measureText(n.label).width;
                const rw = tw + 20, rh = 30;
                const isSel = mindMapSelected === n.id;
                drawCtx.fillStyle = isSel ? 'rgba(212,140,92,0.35)' : 'rgba(212,140,92,0.15)';
                drawCtx.strokeStyle = isSel ? '#f2cc8f' : drawBrush.color; drawCtx.lineWidth = isSel ? 2 : 1;
                drawRoundedRect(drawCtx, n.x - rw/2, n.y - rh/2, rw, rh, 6);
                drawCtx.fill(); drawCtx.stroke();
                drawCtx.fillStyle = '#f0ede8'; drawCtx.textAlign = 'center'; drawCtx.textBaseline = 'middle';
                drawCtx.fillText(n.label, n.x, n.y);
            });
        }
        function drawRoundedRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }
        function saveDrawState() { drawHistory.push(drawCanvas.toDataURL()); if (drawHistory.length > 50) drawHistory.shift(); }
        function undoDraw() {
            if (drawHistory.length < 2) return;
            drawHistory.pop(); const img = new Image();
            img.onload = function() { drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height); drawCtx.drawImage(img,0,0); };
            img.src = drawHistory[drawHistory.length-1];
        }
        function clearDraw() {
            if (!confirm('确定清空画布?')) return;
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            mindMapNodes = []; drawHistory = [];

            saveDrawState();

        const RICH_COLORS = ['#d48c5c','#e07a5f','#f2cc8f','#81b29a','#5c9ad4','#9b5de5','#f15bb5','#fee440','#00bbf9','#00f5d4','#ef476f','#06d6a0','#118ab2','#073b4c','#ff7b00','#3a86ff','#8338ec','#ff006e','#fb5607','#000000','#ffffff','#9a9792'];

            // requests

                        ${amCollabOwner() ? `<button class="btn btn--sm btn--success" onclick="approveCollabControl(${r.id})"><i class="fas fa-check"></i></button><button class="btn btn--sm btn--danger" onclick="rejectCollabControl(${r.id})"><i class="fas fa-times"></i></button>` : '<span style="font-size:11px;color:var(--text-ter);">待处理</span>'}

        function updateCollabControlHint() {

                hint.innerHTML = '<i class="fas fa-crown" style="color:#f2cc8f;"></i> 你是操控人，可以直接绘制。其他人可申请接管。';

                hint.innerHTML = '你已加入。当前操控人：' + escapeHtml(collabCanvasObj.owner_name||'未知') + ' <button class="btn btn--sm" style="margin-left:8px;" onclick="requestCollabControl()"><i class="fas fa-hand-paper"></i> 申请接管</button>';
            } else {

        async function joinCollabCanvas() {

        }
        async function leaveCollabCanvas() {

            closeCollabCanvas();
        }
        async function requestCollabControl() {

        async function approveCollabControl(reqId) {

        async function refreshCollabCanvas() {
            try { const data = await API.get('/api/drawings/' + collabCanvasObj.id); if (data && data.id) { collabCanvasObj = data; updateCollabSidebar(); updateCollabControlHint(); } } catch(e){}
        }

        function bindCollabCanvasEvents() {
            if (collabCanvas._bound) return;
            collabCanvas._bound = true;
            collabCanvas.addEventListener('mousedown', collabStartDraw);
            collabCanvas.addEventListener('mousemove', collabMoveDraw);
            collabCanvas.addEventListener('mouseup', collabEndDraw);
            collabCanvas.addEventListener('mouseleave', collabEndDraw);
            collabCanvas.addEventListener('touchstart', function(e){ e.preventDefault(); const t=e.touches[0]; collabStartDraw({offsetX:t.clientX-collabCanvas.getBoundingClientRect().left, offsetY:t.clientY-collabCanvas.getBoundingClientRect().top}); });
            collabCanvas.addEventListener('touchmove', function(e){ e.preventDefault(); const t=e.touches[0]; collabMoveDraw({offsetX:t.clientX-collabCanvas.getBoundingClientRect().left, offsetY:t.clientY-collabCanvas.getBoundingClientRect().top}); });
            collabCanvas.addEventListener('touchend', collabEndDraw);
        }

        function collabCanDraw() { return amCollabOwner(); }

        function collabPt(e) {
            const rect = collabCanvas.getBoundingClientRect();
            const sx = collabCanvas.width / rect.width, sy = collabCanvas.height / rect.height;
            return { x: (e.offsetX||0)*sx, y: (e.offsetY||0)*sy };
        }

        function collabStartDraw(e) {
            if (!collabCanDraw()) { flashCollabLocked(); return; }
            const p = collabPt(e);
            if (collabBrush.mode === 'pixel') { collabPixel(p.x, p.y); collabHasChanges = true; return; }
            if (['line','rect','circle','arrow','triangle','star'].includes(collabBrush.mode)) {
                collabShapeStart = p;
                collabDrawing = true;
                collabHistory.push(collabCanvas.toDataURL());
                return;
            }
            collabDrawing = true;
            collabHistory.push(collabCanvas.toDataURL());
            const rect = collabCanvas.getBoundingClientRect();
            collabCtx.beginPath();
            collabCtx.moveTo(p.x, p.y);
        }

        function collabMoveDraw(e) {
            if (!collabCanDraw() || !collabDrawing) return;
            const p = collabPt(e);
            if (['line','rect','circle','arrow','triangle','star'].includes(collabBrush.mode)) {
                // preview from history
                const snap = collabHistory[collabHistory.length-1];
                const img = new Image();
                img.onload = () => {
                    collabCtx.clearRect(0,0,collabCanvas.width,collabCanvas.height);
                    collabCtx.drawImage(img,0,0);
                    drawCollabShape(collabShapeStart, p);
                };
                img.src = snap;
                return;
            }
            collabCtx.strokeStyle = collabBrush.color; collabCtx.lineWidth = collabBrush.size;
            collabCtx.lineTo(p.x, p.y); collabCtx.stroke();
        }

        function collabEndDraw() {
            if (!collabDrawing && !['pixel'].includes(collabBrush.mode)) { collabShapeStart = null; return; }
            if (collabDrawing) {
                collabDrawing = false;
                collabHasChanges = true;
                if (collabHistory.length > 50) collabHistory.shift();
            }
            collabShapeStart = null;
            scheduleCollabSave();
        }

        function onCollabPixelSizeChange(v) {
            collabBrush.pixelSize = Math.max(4, Math.min(64, v || 16));
            if (amCollabOwner()) scheduleCollabSave();
        }

        function collabPixel(x, y) {
            const size = collabBrush.pixelSize || 16;
            const px = Math.floor(x/size)*size, py = Math.floor(y/size)*size;
            collabCtx.fillStyle = collabBrush.color;
            collabCtx.fillRect(px, py, size, size);
            collabCtx.strokeStyle = 'rgba(0,0,0,0.08)';
            collabCtx.strokeRect(px, py, size, size);
            scheduleCollabSave();
        }

        function drawCollabShape(a, b) {
            if (!a || !b) return;
            collabCtx.strokeStyle = collabBrush.color; collabCtx.fillStyle = collabBrush.color; collabCtx.lineWidth = collabBrush.size;
            const fill = collabBrush.fill;
            if (collabBrush.mode === 'line') {
                collabCtx.beginPath(); collabCtx.moveTo(a.x,a.y); collabCtx.lineTo(b.x,b.y); collabCtx.stroke();
            } else if (collabBrush.mode === 'rect') {
                const w=b.x-a.x, h=b.y-a.y;
                if (fill) collabCtx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(w), Math.abs(h));
                else collabCtx.strokeRect(a.x, a.y, w, h);
            } else if (collabBrush.mode === 'circle') {
                const rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2, cx=a.x+(b.x-a.x)/2, cy=a.y+(b.y-a.y)/2;
                collabCtx.beginPath(); collabCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
                if (fill) collabCtx.fill(); else collabCtx.stroke();
            } else if (collabBrush.mode === 'triangle') {
                collabCtx.beginPath();
                collabCtx.moveTo(a.x, b.y); collabCtx.lineTo(b.x, b.y); collabCtx.lineTo((a.x+b.x)/2, a.y); collabCtx.closePath();
                if (fill) collabCtx.fill(); else collabCtx.stroke();
            } else if (collabBrush.mode === 'star') {
                drawStar(collabCtx, (a.x+b.x)/2, (a.y+b.y)/2, 5, Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y))/2, Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y))/4);
                if (fill) collabCtx.fill(); else collabCtx.stroke();
            } else if (collabBrush.mode === 'arrow') {
                collabCtx.beginPath(); collabCtx.moveTo(a.x,a.y); collabCtx.lineTo(b.x,b.y); collabCtx.stroke();
                const ang=Math.atan2(b.y-a.y,b.x-a.x), h=12;
                collabCtx.beginPath(); collabCtx.moveTo(b.x,b.y);
                collabCtx.lineTo(b.x-h*Math.cos(ang-Math.PI/6), b.y-h*Math.sin(ang-Math.PI/6));
                collabCtx.moveTo(b.x,b.y);
                collabCtx.lineTo(b.x-h*Math.cos(ang+Math.PI/6), b.y-h*Math.sin(ang+Math.PI/6));
                collabCtx.stroke();
            }
        }

        function drawStar(ctx, cx, cy, spikes, outer, inner) {
            let rot = -Math.PI/2; const step = Math.PI/spikes;
            ctx.beginPath(); ctx.moveTo(cx + Math.cos(rot)*outer, cy + Math.sin(rot)*outer);
            for (let i=0; i<spikes; i++) {
                rot += step; ctx.lineTo(cx + Math.cos(rot)*inner, cy + Math.sin(rot)*inner);
                rot += step; ctx.lineTo(cx + Math.cos(rot)*outer, cy + Math.sin(rot)*outer);
            }
            ctx.closePath();
        }

        function flashCollabLocked() {
            const hint = document.getElementById('collabControlHint');
            hint.style.transition = 'background .2s';
            hint.style.background = 'rgba(239,68,68,0.15)';
            setTimeout(() => { hint.style.background = 'var(--bg)'; }, 400);
        }

        function scheduleCollabSave() {
            if (collabSaveTimer) return;
            collabSaveTimer = setTimeout(() => { collabSaveTimer = null; saveCollabNow(false); }, 600);
        }

        let collabSaving = false;
        async function saveCollabNow(force) {
            if (!collabCanvasObj || !amCollabOwner()) return;
            if (!collabHasChanges && !force) return;
            if (collabSaving) return;
            collabSaving = true;
            try {
                await API.put('/api/drawings/' + collabCanvasObj.id, { data: collabCanvas.toDataURL('image/png') });
                collabHasChanges = false;
            } catch (e) {}
            collabSaving = false;
        }

        function undoCollab() {
            if (!amCollabOwner()) { flashCollabLocked(); return; }
            if (collabHistory.length < 2) return;
            collabHistory.pop();
            const img = new Image();
            img.onload = () => { collabCtx.clearRect(0,0,collabCanvas.width,collabCanvas.height); collabCtx.drawImage(img,0,0); };
            img.src = collabHistory[collabHistory.length-1];
            scheduleCollabSave();
        }

        function clearCollab() {
            if (!amCollabOwner()) { flashCollabLocked(); return; }
            if (!confirm('清空画布？')) return;
            collabHistory.push(collabCanvas.toDataURL());
            collabCtx.clearRect(0,0,collabCanvas.width,collabCanvas.height);
            collabHasChanges = true;
            scheduleCollabSave();
        }

        function exportCollab() {
            const link = document.createElement('a'); link.download = 'collab-drawing.png'; link.href = collabCanvas.toDataURL(); link.click();
        }

        function startCollabPolling() {
            stopCollabPolling();
            collabPollTimer = setInterval(async () => {
                if (!collabCanvasObj) return;
                try {
                    const data = await API.get('/api/drawings/' + collabCanvasObj.id);
                    if (!data || !data.id) return;
                    const ownerChanged = collabCanvasObj.owner_id !== data.owner_id;
                    collabCanvasObj = data;
                    // re-render canvas only if updated by someone else (we are not the owner, or data changed externally)
                    if (data.data && (!amCollabOwner() || ownerChanged)) {
                        const img = new Image();
                        img.onload = () => { collabCtx.clearRect(0,0,collabCanvas.width,collabCanvas.height); collabCtx.drawImage(img,0,0); };
                        img.src = data.data;
                    }
                    updateCollabSidebar();
                    updateCollabControlHint();
                } catch(e){}
            }, 1500);
        }
        function stopCollabPolling() {
            if (collabPollTimer) { clearInterval(collabPollTimer); collabPollTimer = null; }
        }

        // ======================== MINI DRAW POPOVER (chat/meeting) ========================
        let miniCanvas, miniCtx, miniDrawing = false, miniHistory = [], miniShapeStart = null;
        let miniBrush = { color: '#d48c5c', size: 3, mode: 'free' };
        let miniDrawContext = { type: 'public', id: 0 };

        function openMiniDraw(roomType, roomId) {
            miniDrawContext = { type: roomType, id: roomId };
            const pop = document.getElementById('miniDrawPopover');
            pop.style.display = 'block';
            miniCanvas = document.getElementById('miniCanvas');
            if (!miniCtx) {
                miniCtx = miniCanvas.getContext('2d');
                miniCtx.lineCap = 'round'; miniCtx.lineJoin = 'round';
                bindMiniCanvasEvents();
            }
        }
        function closeMiniDraw() {
            document.getElementById('miniDrawPopover').style.display = 'none';
        }
        function setMiniMode(mode) {
            miniBrush.mode = mode;
            document.querySelectorAll('#miniDrawPopover .draw-tools button[data-mmode]').forEach(b => b.classList.toggle('active', b.dataset.mmode === mode));
        }
        function bindMiniCanvasEvents() {
            if (miniCanvas._bound) return; miniCanvas._bound = true;
            miniCanvas.addEventListener('mousedown', miniStart);
            miniCanvas.addEventListener('mousemove', miniMove);
            miniCanvas.addEventListener('mouseup', miniEnd);
            miniCanvas.addEventListener('mouseleave', miniEnd);
            miniCanvas.addEventListener('touchstart', function(e){ e.preventDefault(); const t=e.touches[0]; miniStart({offsetX:t.clientX-miniCanvas.getBoundingClientRect().left, offsetY:t.clientY-miniCanvas.getBoundingClientRect().top}); });
            miniCanvas.addEventListener('touchmove', function(e){ e.preventDefault(); const t=e.touches[0]; miniMove({offsetX:t.clientX-miniCanvas.getBoundingClientRect().left, offsetY:t.clientY-miniCanvas.getBoundingClientRect().top}); });
            miniCanvas.addEventListener('touchend', miniEnd);
        }
        function miniPt(e) {
            const rect = miniCanvas.getBoundingClientRect();
            return { x: (e.offsetX||0)*(miniCanvas.width/rect.width), y: (e.offsetY||0)*(miniCanvas.height/rect.height) };
        }
        function miniStart(e) {
            const p = miniPt(e);
            if (['line','rect','circle','arrow'].includes(miniBrush.mode)) { miniShapeStart = p; miniDrawing = true; miniHistory.push(miniCanvas.toDataURL()); return; }
            miniDrawing = true; miniHistory.push(miniCanvas.toDataURL());
            miniCtx.beginPath(); miniCtx.moveTo(p.x, p.y);
        }
        function miniMove(e) {
            if (!miniDrawing) return;
            const p = miniPt(e);
            if (['line','rect','circle','arrow'].includes(miniBrush.mode)) {
                const img = new Image(); const snap = miniHistory[miniHistory.length-1];
                img.onload = () => { miniCtx.clearRect(0,0,miniCanvas.width,miniCanvas.height); miniCtx.drawImage(img,0,0); miniDrawShape(miniShapeStart, p); };
                img.src = snap; return;
            }
            miniCtx.strokeStyle = miniBrush.color; miniCtx.lineWidth = miniBrush.size; miniCtx.lineTo(p.x, p.y); miniCtx.stroke();
        }
        function miniEnd() {
            if (miniDrawing) { miniDrawing = false; if (miniHistory.length > 30) miniHistory.shift(); }
            miniShapeStart = null;
        }
        function miniDrawShape(a, b) {
            if (!a || !b) return;
            miniCtx.strokeStyle = miniBrush.color; miniCtx.fillStyle = miniBrush.color; miniCtx.lineWidth = miniBrush.size;
            if (miniBrush.mode === 'line') { miniCtx.beginPath(); miniCtx.moveTo(a.x,a.y); miniCtx.lineTo(b.x,b.y); miniCtx.stroke(); }
            else if (miniBrush.mode === 'rect') { miniCtx.strokeRect(a.x, a.y, b.x-a.x, b.y-a.y); }
            else if (miniBrush.mode === 'circle') { const rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2, cx=a.x+(b.x-a.x)/2, cy=a.y+(b.y-a.y)/2; miniCtx.beginPath(); miniCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); miniCtx.stroke(); }
            else if (miniBrush.mode === 'arrow') { miniCtx.beginPath(); miniCtx.moveTo(a.x,a.y); miniCtx.lineTo(b.x,b.y); miniCtx.stroke(); const ang=Math.atan2(b.y-a.y,b.x-a.x), h=10; miniCtx.beginPath(); miniCtx.moveTo(b.x,b.y); miniCtx.lineTo(b.x-h*Math.cos(ang-Math.PI/6), b.y-h*Math.sin(ang-Math.PI/6)); miniCtx.moveTo(b.x,b.y); miniCtx.lineTo(b.x-h*Math.cos(ang+Math.PI/6), b.y-h*Math.sin(ang+Math.PI/6)); miniCtx.stroke(); }
        }
        function miniUndo() { if (miniHistory.length < 2) return; miniHistory.pop(); const img = new Image(); img.onload = () => { miniCtx.clearRect(0,0,miniCanvas.width,miniCanvas.height); miniCtx.drawImage(img,0,0); }; img.src = miniHistory[miniHistory.length-1]; }
        function miniClear() { miniHistory.push(miniCanvas.toDataURL()); miniCtx.clearRect(0,0,miniCanvas.width,miniCanvas.height); }
        async function miniSendAsImage() {
            const dataUrl = miniCanvas.toDataURL('image/png');
            try {
                if (miniDrawContext.type === 'meeting') {
                    await API.post(`/api/meetings/${miniDrawContext.id}/chat`, { content: dataUrl, message_type: 'image' });
                    pollMeetingMessages();
                } else {
                    await API.post('/api/chat', { content: dataUrl, message_type: 'image' });
                    pollPublicMessages();
                }
                miniClear();
                closeMiniDraw();
            } catch (e) { alert('发送失败'); }
        }
        async function miniSendAsCanvas() {
            const dataUrl = miniCanvas.toDataURL('image/png');
            try {
                const canvas = await API.post('/api/drawings', { room_type: miniDrawContext.type, room_id: miniDrawContext.id, title: '协作画布', mode: 'free' });
                if (canvas && canvas.id) {
                    await API.put('/api/drawings/' + canvas.id, { data: dataUrl });
                    closeMiniDraw();
                    openDrawingGallery(miniDrawContext.type, miniDrawContext.id);
                }
            } catch (e) { alert('发起协作失败'); }
        }

        // ======================== TODOS ========================
        let todoFilter = 'all', todoSort = 'created_at';

        function initTodos() {

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    todoFilter = this.dataset.filter;

            });

                todoSort = this.value;
                loadTodos();
            });

                const input = document.getElementById('todoInput');
